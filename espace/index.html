<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BizPiano · Espace de travail</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#26332f;background:#f6f7f4}*{box-sizing:border-box}body{margin:0}.layout{display:grid;grid-template-columns:265px 1fr;min-height:100vh}aside{background:#e9eee9;padding:24px 16px;border-right:1px solid #d6dfd6}aside h1{font-size:22px;margin:0 0 4px}aside p{color:#60736a;font-size:13px;margin:0 0 24px}.nav button{width:100%;text-align:left;border:0;background:transparent;border-radius:10px;padding:12px;cursor:pointer;font:inherit;color:inherit;margin:2px 0}.nav button:hover,.nav button.active{background:white;color:#216451}main{padding:28px clamp(18px,5vw,70px);max-width:1100px;width:100%}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:24px}.pill{font-size:12px;border-radius:100px;background:#e2efe6;color:#286046;padding:6px 12px}.panel{background:white;border:1px solid #dfe6df;border-radius:16px;padding:clamp(20px,4vw,40px);min-height:65vh;box-shadow:0 8px 24px #243b2b0a}h2{margin-top:0;font-size:clamp(25px,3vw,36px)}h3{margin-top:28px}p,li{line-height:1.75}blockquote{border-left:4px solid #72a58b;background:#f1f7f2;margin:16px 0;padding:10px 18px}button,.link{cursor:pointer}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.action{border:1px solid #bdd1c4;background:white;border-radius:9px;padding:10px 14px;color:#215f49;text-decoration:none;font:inherit}.action.primary{background:#286c52;color:white}.muted{color:#67776f;font-size:14px}textarea{width:100%;min-height:220px;padding:15px;border:1px solid #cad7cf;border-radius:12px;font:15px/1.6 system-ui;resize:vertical}input[type=number]{width:110px;padding:10px;border:1px solid #cad7cf;border-radius:8px;font:inherit}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.metric{padding:16px;background:#f5f8f5;border-radius:12px}.metric label{display:block;font-size:14px;margin-bottom:8px}.doc h1{font-size:27px}.doc h2{font-size:21px;margin-top:28px}.doc ul{padding-left:22px}.doc strong{color:#194f3a}.doc hr{border:0;border-top:1px solid #ddd}#status{font-size:13px;color:#617469}@media(max-width:720px){.layout{display:block}aside{padding:14px;height:auto;border-right:0;border-bottom:1px solid #d6dfd6}aside h1{font-size:18px}aside p{margin-bottom:10px}.nav{display:flex;overflow-x:auto;gap:4px}.nav button{width:auto;white-space:nowrap}main{padding:18px}.metrics{grid-template-columns:1fr}.panel{min-height:40vh}}</style></head><body>
<div class="layout"><aside><h1>🎹 BizPiano</h1><p>Notre espace de travail · GitHub uniquement</p><nav class="nav" id="nav"></nav></aside><main><header><span class="pill">Bibliothèque & suivi commercial</span><a class="action" href="../">← Bibliothèque BizPiano</a></header><section class="panel"><h2 id="title">Bienvenue</h2><div id="body"></div><div class="actions" id="actions"></div><p id="status"></p></section></main></div>
<script>
const repo='ludodulac/bizpiano', base='https://github.com/'+repo+'/edit/main/';
const pages=[
['accueil','🏠 Accueil',null],['discussion','💬 Notre discussion','espace/discussion-2026-11-16.md'],['questions','❓ Questions / réponses','espace/questions-reponses-2026-11-16.md'],['etat','📍 État du projet','compte-rendu/ETAT-DU-PROJET.md'],['strategie','🎯 Stratégie','espace/strategie.md'],['indicateurs','📊 Indicateurs',null],['tests','🧪 Tests et décisions','espace/tests.md'],['ventes','💶 Historique des ventes','espace/ventes.md'],['notes','📝 Mes notes',null]];
const nav=document.getElementById('nav'),body=document.getElementById('body'),actions=document.getElementById('actions'),status=document.getElementById('status');
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function markdown(s){return s.split('\n').map(l=>{let x=escapeHtml(l).replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\`([^\`]+)\`/g,'<code>$1</code>');if(/^### /.test(x))return '<h3>'+x.slice(4)+'</h3>';if(/^## /.test(x))return '<h2>'+x.slice(3)+'</h2>';if(/^# /.test(x))return '<h1>'+x.slice(2)+'</h1>';if(/^[-*] /.test(x))return '<p>• '+x.slice(2)+'</p>';if(/^\d+\. /.test(x))return '<p>'+x+'</p>';if(/^> /.test(x))return '<blockquote>'+x.slice(2)+'</blockquote>';if(/^---+$/.test(x))return '<hr>';return x.trim()?'<p>'+x+'</p>':''}).join('')}
function button(label,handler,primary=false){const b=document.createElement('button');b.className='action'+(primary?' primary':'');b.textContent=label;b.onclick=handler;actions.appendChild(b)}
function link(label,url){const a=document.createElement('a');a.className='action';a.textContent=label;a.href=url;a.target='_blank';a.rel='noopener';actions.appendChild(a)}
function show(id){const p=pages.find(x=>x[0]===id)||pages[0];history.replaceState(null,'','#'+p[0]);document.getElementById('title').textContent=p[1];document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.id===p[0]));body.innerHTML='';actions.innerHTML='';status.textContent='';
if(p[2]){body.innerHTML='<p>Chargement…</p>';fetch('../'+p[2]).then(r=>{if(!r.ok)throw Error(r.status);return r.text()}).then(t=>{body.innerHTML='<div class="doc">'+markdown(t)+'</div>'}).catch(()=>{body.innerHTML='<p>Impossible de charger la fiche. Consulte-la dans GitHub.</p>'});link('✏️ Modifier cette page dans GitHub',base+p[2]);return}
if(id==='accueil'){body.innerHTML='<p>Un endroit simple pour conserver notre discussion, retrouver les décisions et suivre les progrès sans multiplier les paramètres.</p><h3>Notre règle</h3><p><strong>Une priorité, trois indicateurs maximum, un changement important à la fois.</strong></p><p>Les comptes rendus sont conservés dans le dépôt GitHub. Pour les modifier durablement, utilise « Modifier dans GitHub » sur chaque fiche.</p><p class="muted">Ce dépôt est actuellement public : n’y écris pas de données confidentielles ou personnelles.</p>';return}
if(id==='indicateurs'){body.innerHTML='<p>Renseigne les résultats de la semaine. Ces valeurs restent dans ce navigateur jusqu’à leur export ; elles ne sont pas envoyées automatiquement à GitHub.</p><div class="metrics">'+[['clics','Clics Calendly'],['rdv','Rendez-vous'],['ventes','Ventes']].map(([k,n])=>'<div class="metric"><label for="'+k+'">'+n+'</label><input type="number" min="0" id="'+k+'" value="'+escapeHtml(localStorage.getItem('bizpiano_'+k)||'0')+'"></div>').join('')+'</div><p class="muted">Une donnée inconnue doit être notée comme inconnue, pas estimée.</p>';button('Enregistrer sur cet appareil',()=>{['clics','rdv','ventes'].forEach(k=>localStorage.setItem('bizpiano_'+k,document.getElementById(k).value));status.textContent='Enregistré sur cet appareil seulement.'},true);button('Copier le bilan pour GitHub',async()=>{const s='## Bilan du '+new Date().toLocaleDateString('fr-FR')+'\n- Clics Calendly : '+document.getElementById('clics').value+'\n- Rendez-vous : '+document.getElementById('rdv').value+'\n- Ventes : '+document.getElementById('ventes').value;await navigator.clipboard.writeText(s);status.textContent='Bilan copié. Colle-le dans la fiche GitHub.'});link('Ouvrir la fiche des tests dans GitHub',base+'espace/tests.md');return}
if(id==='notes'){body.innerHTML='<p>Écris ici tes observations. Elles sont conservées localement sur cet appareil ; copie-les dans GitHub pour les archiver durablement.</p><textarea id="note" placeholder="Une idée, un résultat, une question…"></textarea><p class="muted">Ne saisis pas d’informations privées : le dépôt GitHub est public.</p>';document.getElementById('note').value=localStorage.getItem('bizpiano_notes')||'';button('Enregistrer sur cet appareil',()=>{localStorage.setItem('bizpiano_notes',document.getElementById('note').value);status.textContent='Note conservée sur cet appareil.'},true);button('Copier pour GitHub',async()=>{await navigator.clipboard.writeText(document.getElementById('note').value);status.textContent='Note copiée. Colle-la dans un fichier du dépôt.'});link('Archiver dans GitHub',base+'espace/tests.md')}
}
pages.forEach(p=>{const b=document.createElement('button');b.textContent=p[1];b.dataset.id=p[0];b.onclick=()=>show(p[0]);nav.appendChild(b)});show(location.hash.slice(1)||'accueil');
</script></body></html>
