function markdown(s){const inline=t=>escapeHtml(t).replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\x60([^\x60]+)\x60/g,'<code>$1</code>').replace(/\[([^\]]+)\]\((https?:\/\/[^)]+|#[a-z0-9-]+)\)/g,(_,label,url)=>'<a href="'+url+'" '+(url.startsWith('http')?'target="_blank" rel="noopener"':'')+'>'+label+'</a>');let table=[];const flush=()=>{if(!table.length)return '';const rows=table.filter(l=>!/^\|[\s:|-]+\|$/.test(l));table=[];return '<div style="overflow-x:auto"><table>'+rows.map((l,i)=>'<tr>'+l.split('|').slice(1,-1).map(c=>'<'+(i===0?'th':'td')+'>'+inline(c.trim())+'</'+(i===0?'th':'td')+'>').join('')+'</tr>').join('')+'</table></div>'};let out='';for(const l of s.split('\n')){if(l.startsWith('|')){table.push(l);continue}out+=flush();const x=inline(l);if(/^### /.test(l))out+='<h3>'+x.slice(4)+'</h3>';else if(/^## /.test(l))out+='<h2>'+x.slice(3)+'</h2>';else if(/^# /.test(l))out+='<h1>'+x.slice(2)+'</h1>';else if(/^[-*] /.test(l))out+='<p>• '+x.slice(2)+'</p>';else if(/^\d+\. /.test(l))out+='<p>'+x+'</p>';else if(/^> /.test(l))out+='<blockquote>'+x.slice(2)+'</blockquote>';else if(/^---+$/.test(l))out+='<hr>';else if(l.trim())out+='<p>'+x+'</p>'}return out+flush()}

const CRM_KEY='bizpiano-crm-v1';const initialTasks=[{id:'t1',title:'Répondre au commentaire du pianiste intéressé',detail:'Demander depuis combien de temps il joue et son blocage principal.',priority:'Aujourd’hui',done:false},{id:'t2',title:'Répondre au commentaire « La dernière »',detail:'Remercier et demander s’il joue du blues.',priority:'Aujourd’hui',done:false},{id:'t3',title:'Publier une Story-question',detail:'Accords, rythme, improvisation ou coordination : inviter à répondre.',priority:'Aujourd’hui',done:false},{id:'t4',title:'Examiner les nouveaux abonnés',detail:'Vérifier si leurs profils indiquent un intérêt pour le piano ; ne pas supposer.',priority:'Cette semaine',done:false},{id:'t5',title:'Noter les réponses et qualifier les besoins',detail:'Ne proposer un appel que si la personne montre un intérêt réel.',priority:'Cette semaine',done:false},{id:'t6',title:'Vérifier les appels Calendly et les demandes',detail:'Contrôler les nouvelles réservations et les prochaines actions.',priority:'Cette semaine',done:false},{id:'t7',title:'Tourner la vidéo n° 1 : accords en blocs',detail:'Accords plaqués puis renversements fluides.',priority:'Cette semaine',done:false},{id:'t8',title:'Faire 60 minutes de veille concurrentielle',detail:'Noter les accroches et les vidéos pertinentes pour la vente.',priority:'Cette semaine',done:false},{id:'t9',title:'Analyser les résultats du Reel normal et du Reel d’essai',detail:'Comparer abonnés, rétention, enregistrements et conversations.',priority:'Cette semaine',done:false}];function crmRead(){try{const d=JSON.parse(localStorage.getItem(CRM_KEY));if(d&&Array.isArray(d.tasks)&&Array.isArray(d.leads))return d}catch(e){}return {tasks:initialTasks,leads:[{id:'lead-a',alias:'Prospect A — commentaire enthousiaste',stage:'À répondre',note:'A commenté que la vidéo lui était utile ; nouvel abonné.'},{id:'lead-b',alias:'Prospect B — préfère la dernière démonstration',stage:'À répondre',note:'A commenté « La dernière ». '}],history:[]}} =document.createElement('div');el.className='video-row';const label=document.createElement('label');label.style.display='flex';label.style.gap='12px';label.style.alignItems='flex-start';const ck=document.createElement('input');ck.type='checkbox';ck.checked=!!t.done;ck.style.marginTop='5px';ck.onchange=()=>{const x=crmRead();const item=x.tasks.find(v=>v.id===t.id);item.done=ck.checked;crmEvent(x,(ck.checked?'Terminée : ':'Rouverte : ')+item.title);crmSave(x);crmRender()};const txt=document.createElement('span');txt.innerHTML='<strong>'+escapeHtml(t.title)+'</strong><br><small>'+escapeHtml(t.detail||'')+'</small>';if(t.done)txt.style.opacity='.55';label.append(ck,txt);el.appendChild(label);tasks.appendChild(el)})});const leads=document.getElementById('crm-leads');d.leads.forEach(l=>{const el=document.createElement('div');el.className='video-row';const title=document.createElement('strong');title.textContent=l.alias;const p=document.createElement('p');p.className='muted';p.textContent=l.note||'';const sel=document.createElement('select');sel.style.padding='8px';sel.style.borderRadius='8px';['À répondre','Message envoyé','En discussion','Appel proposé','Appel réservé','Client','Sans suite'].forEach(stage=>{const opt=document.createElement('option');opt.value=stage;opt.textContent=stage;sel.appendChild(opt)});sel.value=l.stage;sel.onchange=()=>{const x=crmRead(),v=x.leads.find(y=>y.id===l.id);v.stage=sel.value;crmEvent(x,v.alias+' → '+sel.value);crmSave(x);crmRender()};el.append(title,p,sel);leads.appendChild(el)});document.getElementById('crm-history').innerHTML=d.history.slice(0,8).map(e=>'<p class="muted">'+escapeHtml(e.at.slice(0,16).replace('T',' '))+' — '+escapeHtml(e.message)+'</p>').join('')||'<p class="muted">Aucune action confirmée pour le moment.</p>';document.getElementById('crm-add-task').onclick=()=>{const v=document.getElementById('crm-new-task').value.trim();if(!v)return;const x=crmRead();x.tasks.push({id:'t'+Date.now(),title:v,detail:'',priority:'Cette semaine',done:false});crmEvent(x,'Tâche ajoutée : '+v);crmSave(x);crmRender()};document.getElementById('crm-add-lead').onclick=()=>{const v=document.getElementById('crm-new-lead').value.trim();if(!v)return;const x=crmRead();x.leads.push({id:'l'+Date.now(),alias:v,stage:'À répondre',note:''});crmEvent(x,'Fiche ajoutée : '+v);crmSave(x);crmRender()};actions.innerHTML='';button('📦 Exporter une sauvegarde JSON',()=>{const blob=new Blob([JSON.stringify(crmRead(),null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='bizpiano-crm-sauvegarde.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)},true);link('📞 Ouvrir Calendly','https://calendly.com/ludovicpiano/rdv-gratuit')}
