function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function markdown(s){const inline=t=>escapeHtml(t).replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\x60([^\x60]+)\x60/g,'<code>$1</code>').replace(/\[([^\]]+)\]\((https?:\/\/[^)]+|#[a-z0-9-]+)\)/g,(_,label,url)=>'<a href="'+url+'" '+(url.startsWith('http')?'target="_blank" rel="noopener"':'')+'>'+label+'</a>');let table=[];const flush=()=>{if(!table.length)return '';const rows=table.filter(l=>!/^\|[\s:|-]+\|$/.test(l));table=[];return '<div style="overflow-x:auto"><table>'+rows.map((l,i)=>'<tr>'+l.split('|').slice(1,-1).map(c=>'<'+(i===0?'th':'td')+'>'+inline(c.trim())+'</'+(i===0?'th':'td')+'>').join('')+'</tr>').join('')+'</table></div>'};let out='';for(const l of s.split('\n')){if(l.startsWith('|')){table.push(l);continue}out+=flush();const x=inline(l);if(/^### /.test(l))out+='<h3>'+x.slice(4)+'</h3>';else if(/^## /.test(l))out+='<h2>'+x.slice(3)+'</h2>';else if(/^# /.test(l))out+='<h1>'+x.slice(2)+'</h1>';else if(/^[-*] /.test(l))out+='<p>• '+x.slice(2)+'</p>';else if(/^\d+\. /.test(l))out+='<p>'+x+'</p>';else if(/^> /.test(l))out+='<blockquote>'+x.slice(2)+'</blockquote>';else if(/^---+$/.test(l))out+='<hr>';else if(l.trim())out+='<p>'+x+'</p>'}return out+flush()}
